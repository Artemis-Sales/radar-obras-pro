name: Radar de Obras PRO - Scraper Diário

on:
  schedule:
    # 09:00 UTC corresponde a 06:00 Horário de Brasília
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite disparo manual pelo Github

jobs:
  maestro-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci

      - name: 🌐 Instalar navegadores para o Puppeteer
        run: npx puppeteer browsers install chrome

      - name: 🚀 Executar Varredura (Maestro)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        # Passar os logs para evitar interrupções caso um console falhe no runner
        run: node scripts/run-all.mjs
